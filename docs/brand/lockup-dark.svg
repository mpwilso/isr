<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 100" width="250" height="100" role="img" aria-label="ISR"><title>ISR</title><style>.sweep{transform-box:view-box;transform-origin:50px 50px;animation:turn 6s linear infinite}@keyframes turn{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.blip{animation:glow 6s linear infinite}@keyframes glow{0%{opacity:1}4%{opacity:1}45%{opacity:.45}100%{opacity:.45}}.ping{transform-box:fill-box;transform-origin:center;opacity:0;animation:ping 6s ease-out infinite}@keyframes ping{0%{opacity:.9;transform:scale(1)}18%{opacity:0;transform:scale(2.6)}100%{opacity:0;transform:scale(2.6)}}.b2{animation-delay:-1.863s}.b3{animation-delay:-4.157s}@media (prefers-reduced-motion: reduce){*{animation:none!important}.ping{opacity:0}}.word{font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:3px}</style><circle cx="50" cy="50" r="44" fill="#24190B"/><g fill="none" stroke="#5E4220" stroke-width="2"><circle cx="50" cy="50" r="29"/><circle cx="50" cy="50" r="14"/><path d="M50 8 V92 M8 50 H92"/></g><g class="sweep"><path d="M50 50 L50 7 A43 43 0 0 1 80.4 19.6 Z" fill="#FBBF24" fill-opacity=".35"/><path d="M50 50 L80.4 19.6" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/></g><g fill="none" stroke="#FCD34D" stroke-width="2"><circle class="ping b1" cx="67" cy="33" r="7"/><circle class="ping b2" cx="29" cy="41" r="6.5"/><circle class="ping b3" cx="60" cy="72" r="6.5"/></g><circle class="blip b1" cx="67" cy="33" r="7" fill="#FCD34D"/><circle class="blip b2" cx="29" cy="41" r="6.5" fill="none" stroke="#FCD34D" stroke-width="3.5"/><circle class="blip b3" cx="60" cy="72" r="6.5" fill="none" stroke="#FCD34D" stroke-width="3.5" stroke-dasharray="4.2 3"/><circle cx="50" cy="50" r="44" fill="none" stroke="#F0A13A" stroke-width="5"/><text class="word" x="110" y="69" font-size="56" fill="#EDEDEA">ISR</text></svg>
